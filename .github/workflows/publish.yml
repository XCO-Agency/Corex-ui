name: Publish Package

# `release: created` is intentionally not a trigger. The old workflow listened
# to both created and published, so one GitHub Release published the package twice.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (pack and verify, do not publish to npm)
        type: boolean
        required: false
        default: true
  workflow_call:
    inputs:
      tag:
        description: Annotated tag vX.Y.Z to publish
        type: string
        required: true
      dry_run:
        description: Pack only; do not publish to npm
        type: boolean
        required: false
        default: false

# id-token: write lets npm Trusted Publishing exchange a GitHub OIDC token.
# No npm access token is used. Direct release:published and workflow_dispatch
# runs are attributed to this file (publish.yml). A workflow_call from Release
# is attributed to release.yml instead; that caller job also has id-token: write.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @xco-agency/corex-ui
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: npm-publish-corex-ui-${{ inputs.tag || github.event.release.tag_name || github.ref }}
      cancel-in-progress: false
    steps:
      - name: Resolve publish mode
        id: mode
        run: |
          # A called workflow inherits the caller's github.event_name (push for
          # Release), never workflow_call. inputs.tag is set only on that call,
          # so a non-empty tag must win before any event-name branch. Otherwise
          # the push path reads an empty github.event.release.tag_name and
          # refuses to publish. workflow_dispatch has no tag input and still
          # publishes the selected ref. release: published still uses the
          # release payload.
          event="${{ github.event_name }}"
          tag="${{ inputs.tag }}"
          if [ -n "$tag" ]; then
            dry="${{ inputs.dry_run }}"
          elif [ "$event" = "workflow_dispatch" ]; then
            tag="${GITHUB_REF_NAME}"
            dry="${{ inputs.dry_run }}"
            if [ -z "$dry" ]; then
              dry="true"
            fi
          else
            tag="${{ github.event.release.tag_name }}"
            dry="false"
          fi
          if [ "$dry" != "true" ]; then
            dry="false"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${dry}" >> "$GITHUB_OUTPUT"
          if printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "fetch_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "fetch_tag=false" >> "$GITHUB_OUTPUT"
            if [ "$dry" != "true" ]; then
              echo "Refusing to publish from ref: ${tag}"
              exit 1
            fi
          fi
          echo "tag=${tag} dry_run=${dry}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch release tag
        if: steps.mode.outputs.fetch_tag == 'true'
        env:
          RELEASE_TAG: ${{ steps.mode.outputs.tag }}
        run: git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

      - name: Assert tag matches package.json
        env:
          RELEASE_TAG: ${{ steps.mode.outputs.tag }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/assert-release-version.mjs --tag "$RELEASE_TAG" --allow-non-release-ref
          else
            node scripts/assert-release-version.mjs --tag "$RELEASE_TAG" --require-tag
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # Node 24 and npm >= 11.5.1 are required for npm Trusted Publishing.
      # package-manager-cache stays off for the release build. registry-url
      # points npm at the public registry; the placeholder token setup-node
      # writes for that URL is removed in the next step so publish uses OIDC.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use OIDC instead of an npm token
        run: |
          set -euo pipefail
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            grep -v '_authToken' "$NPM_CONFIG_USERCONFIG" > "${NPM_CONFIG_USERCONFIG}.tmp"
            mv "${NPM_CONFIG_USERCONFIG}.tmp" "$NPM_CONFIG_USERCONFIG"
          fi
          # Later steps must not inherit setup-node's placeholder token.
          echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"

      - name: Ensure npm CLI supports trusted publishing
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN
          node --version
          echo "bundled npm $(npm --version)"
          npm install -g npm@11
          version="$(npm --version)"
          echo "npm ${version}"
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map((part) => Number(part)); const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))); if (!ok) { console.error("npm " + process.argv[1] + " is older than 11.5.1"); process.exit(1); }' "$version"

      - name: Skip when this version is already on npm
        id: preflight
        env:
          RELEASE_TAG: ${{ steps.mode.outputs.tag }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          unset NODE_AUTH_TOKEN
          node scripts/publish-npm.mjs --preflight

      - name: Install dependencies
        if: steps.preflight.outputs.skip != 'true'
        run: |
          unset NODE_AUTH_TOKEN
          pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.preflight.outputs.skip != 'true'
        run: pnpm --filter @xco-agency/corex-ui run typecheck

      - name: Test
        if: steps.preflight.outputs.skip != 'true'
        run: pnpm --filter @xco-agency/corex-ui run test

      - name: Build package
        if: steps.preflight.outputs.skip != 'true'
        run: pnpm --filter @xco-agency/corex-ui run build

      - name: Publish to npm
        if: steps.preflight.outputs.skip != 'true'
        env:
          RELEASE_TAG: ${{ steps.mode.outputs.tag }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          unset NODE_AUTH_TOKEN
          node scripts/publish-npm.mjs
